name: Release Gate
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - name: Release summary
        run: echo "Neburion XV73 release candidate passed quality gate."
