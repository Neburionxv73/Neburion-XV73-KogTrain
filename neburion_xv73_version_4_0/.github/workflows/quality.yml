name: Neburion Quality & Build Cache

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: neburion-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten und npm-Cache aktivieren
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Next.js-Build-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.json', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: Gesamtprüfung ausführen
        run: npm run quality:full
